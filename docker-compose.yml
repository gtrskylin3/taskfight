version: '3.8'

services:
  db:
    image: postgres:15
    container_name: taskfight-db
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"  # Bind to localhost only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: taskfight-backend
    ports:
      - "127.0.0.1:8000:8000"  # Bind to localhost only
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: taskfight-frontend
    ports:
      - "127.0.0.1:5173:5173"  # Bind to localhost only
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000  # Use service name for internal communication
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
