<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Timer - TaskFight</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap');
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col">
    <div x-data="timerApp()" class="flex-grow flex flex-col items-center justify-center">
        <!-- Back button -->
        <div class="absolute top-6 left-6">
            <a href="/" class="btn-secondary flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Tasks
            </a>
        </div>

        <!-- Current task info -->
        <div class="text-center mb-10 max-w-2xl w-full px-4">
            <h2 x-text="currentTask?.name || 'Loading...'" class="text-2xl md:text-3xl font-bold mb-4 text-[#f0f0f0] press-start-font"></h2>
            <div class="flex flex-wrap items-center justify-center gap-3">
                <span class="priority-badge"
                      :class="{
                          'priority-low': currentTask?.priority === 'low',
                          'priority-medium': currentTask?.priority === 'medium',
                          'priority-high': currentTask?.priority === 'high'
                      }"
                      x-text="currentTask?.priority"></span>
                <span class="tag-badge" x-text="currentTask?.tag"></span>
            </div>
        </div>

        <!-- Timer Display -->
        <div class="timer-display" x-text="
            remainingSeconds >= 3600 ?
                Math.floor(remainingSeconds / 3600) + ':' +
                Math.floor((remainingSeconds % 3600) / 60).toString().padStart(2, '0') + ':' +
                (remainingSeconds % 60).toString().padStart(2, '0') :
                Math.floor((remainingSeconds % 3600) / 60) + ':' +
                (remainingSeconds % 60).toString().padStart(2, '0')
        "></div>

        <!-- Progress Bar -->
        <div class="w-4/5 max-w-2xl mb-12">
            <div class="flex justify-between text-sm mb-2">
                <span x-text="`${Math.round(progressPercentage)}% Complete`"></span>
                <span x-text="`${timeSpentMinutes}/${currentTask?.timer || 0} min`"></span>
            </div>
            <div class="progress-bar">
                <div class="progress-bar-fill" :style="`width: ${progressPercentage}%`"></div>
            </div>
        </div>

        <!-- Timer Controls -->
        <div class="timer-controls flex flex-wrap justify-center gap-4">
            <button @click="toggleTimer" :disabled="!currentTask" class="btn-primary px-8 py-4 text-lg flex items-center" x-text="isRunning ? 'Pause' : 'Resume'">
                <template x-if="isRunning">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </template>
                <template x-if="!isRunning">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </template>
            </button>
            <button @click="stopTimer" :disabled="!currentTask" class="btn-secondary px-8 py-4 text-lg flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
                </svg>
                Stop
            </button>
            <button @click="completeTask" :disabled="!currentTask" class="btn-primary px-8 py-4 text-lg flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Complete
            </button>
        </div>
    </div>

    <script>
        function timerApp() {
            return {
                currentTask: null,
                taskId: null,
                remainingSeconds: 0,
                isRunning: false,
                timerInterval: null,

                get progressPercentage() {
                    if (!this.currentTask || this.currentTask.timer <= 0) return 0;
                    const totalTimeSeconds = this.currentTask.timer * 60;
                    const elapsedSeconds = totalTimeSeconds - this.remainingSeconds;
                    return (elapsedSeconds / totalTimeSeconds) * 100;
                },

                get timeSpentMinutes() {
                    if (!this.currentTask) return 0;
                    const totalTimeSeconds = this.currentTask.timer * 60;
                    const elapsedSeconds = totalTimeSeconds - this.remainingSeconds;
                    return Math.round(elapsedSeconds / 60);
                },

                async init() {
                    // Get task ID from URL
                    const urlParams = new URLSearchParams(window.location.search);
                    this.taskId = parseInt(urlParams.get('taskId'));

                    if (this.taskId) {
                        await this.loadTask();
                        this.remainingSeconds = (this.currentTask.timer - this.currentTask.time_spent) * 60;
                        this.initialRemainingSeconds = this.remainingSeconds;

                        // Start the timer if it was previously running
                        if (this.currentTask.is_active) {
                            this.startTimer();
                        }
                    }
                },

                async loadTask() {
                    try {
                        const response = await fetch(`http://localhost:8000/tasks/${this.taskId}`);
                        this.currentTask = await response.json();
                    } catch (error) {
                        console.error('Error loading task:', error);
                    }
                },

                formatTime(seconds) {
                    const mins = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                },

                startTimer() {
                    if (this.timerInterval) clearInterval(this.timerInterval);

                    this.isRunning = true;
                    this.startTime = Date.now();

                    this.timerInterval = setInterval(() => {
                        // Обновляем remainingSeconds на основе прошедшего времени
                        const elapsedTime = Math.floor((Date.now() - this.startTime) / 1000);
                        const newRemaining = Math.max(0, this.initialRemainingSeconds - elapsedTime);

                        // Обновляем только если значение изменилось
                        if (this.remainingSeconds !== newRemaining) {
                            this.remainingSeconds = newRemaining;
                        }

                        if (this.remainingSeconds <= 0) {
                            this.endTimer();
                        }
                    }, 1000);
                },

                pauseTimer() {
                    this.isRunning = false;
                    if (this.timerInterval) {
                        clearInterval(this.timerInterval);
                        this.timerInterval = null;

                        // Обновляем remainingSeconds на основе прошедшего времени
                        if (this.startTime) {
                            const elapsedTime = Math.floor((Date.now() - this.startTime) / 1000);
                            this.remainingSeconds = Math.max(0, this.initialRemainingSeconds - elapsedTime);
                        }
                    }
                },

                toggleTimer() {
                    if (this.isRunning) {
                        this.pauseTimer();
                        this.sendPauseRequest();
                    } else {
                        this.startTimer();
                        this.sendResumeRequest();
                    }
                },

                endTimer() {
                    this.pauseTimer();

                    // Calculate time elapsed in minutes
                    const timeElapsed = Math.floor((this.currentTask.timer * 60 - this.remainingSeconds) / 60);

                    // Send complete request to backend
                    fetch(`http://localhost:8000/tasks/${this.taskId}/complete`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ time_elapsed: timeElapsed })
                    })
                    .then(response => {
                        if (response.ok) {
                            alert('Timer completed and task marked as complete!');
                            window.location.href = '/';
                        } else {
                            alert('Timer completed but there was an issue marking the task as complete.');
                        }
                    })
                    .catch(error => {
                        console.error('Error completing task:', error);
                        alert('Timer completed but there was an error communicating with the server.');
                    });
                },

                async sendPauseRequest() {
                    try {
                        await fetch(`http://localhost:8000/tasks/${this.taskId}/pause-timer`, {
                            method: 'POST'
                        });
                    } catch (error) {
                        console.error('Error pausing timer:', error);
                    }
                },

                async sendResumeRequest() {
                    try {
                        await fetch(`http://localhost:8000/tasks/${this.taskId}/start-timer`, {
                            method: 'POST'
                        });
                    } catch (error) {
                        console.error('Error resuming timer:', error);
                    }
                },

                async stopTimer() {
                    this.pauseTimer();

                    // Calculate actual time elapsed based on start time
                    let timeElapsed;
                    if (this.startTime) {
                        // Calculate based on actual elapsed time since start
                        const actualElapsedTime = Math.floor((Date.now() - this.startTime) / 1000 / 60); // in minutes
                        timeElapsed = Math.max(0, actualElapsedTime);
                    } else {
                        // Fallback to previous calculation
                        timeElapsed = Math.floor((this.currentTask.timer * 60 - this.remainingSeconds) / 60);
                    }

                    try {
                        const response = await fetch(`http://localhost:8000/tasks/${this.taskId}/stop-timer`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ time_elapsed: timeElapsed })
                        });

                        if (response.ok) {
                            window.location.href = '/';
                        }
                    } catch (error) {
                        console.error('Error stopping timer:', error);
                    }
                },

                async completeTask() {
                    if (!confirm('Are you sure you want to complete this task?')) return;

                    this.pauseTimer();

                    // Calculate time elapsed in minutes
                    const timeElapsed = Math.floor((this.currentTask.timer * 60 - this.remainingSeconds) / 60);

                    try {
                        const response = await fetch(`http://localhost:8000/tasks/${this.taskId}/complete`,  {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ time_elapsed: timeElapsed })
                        });

                        if (response.ok) {
                            window.location.href = '/';
                        }
                    } catch (error) {
                        console.error('Error completing task:', error);
                    }
                }
            }
        }
    </script>
</body>
</html>
