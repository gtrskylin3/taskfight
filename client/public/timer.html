<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Timer - TaskFight</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/src/main.js" type="module"></script>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-black text-white min-h-screen flex flex-col">
    <div x-data="timerApp()" class="flex-grow flex flex-col items-center justify-center">
        <!-- Back button -->
        <div class="absolute top-4 left-4">
            <a href="/" class="btn-secondary">← Back to Tasks</a>
        </div>
        
        <!-- Current task info -->
        <div class="text-center mb-8">
            <h2 x-text="currentTask?.name || 'Loading...'" class="text-2xl font-bold mb-2"></h2>
            <div class="flex items-center justify-center space-x-4">
                <span class="px-2 py-1 rounded text-sm" 
                      :class="{
                          'bg-green-500': currentTask?.priority === 'low',
                          'bg-yellow-500': currentTask?.priority === 'medium', 
                          'bg-red-500': currentTask?.priority === 'high'
                      }" 
                      x-text="currentTask?.priority"></span>
                <span class="bg-indigo-500 px-2 py-1 rounded text-sm" x-text="currentTask?.tag"></span>
            </div>
        </div>
        
        <!-- Timer Display -->
        <div class="timer-display" x-text="
            remainingSeconds >= 3600 ?
                Math.floor(remainingSeconds / 3600) + ':' +
                Math.floor((remainingSeconds % 3600) / 60).toString().padStart(2, '0') + ':' +
                (remainingSeconds % 60).toString().padStart(2, '0') :
                Math.floor((remainingSeconds % 3600) / 60) + ':' +
                (remainingSeconds % 60).toString().padStart(2, '0')
        "></div>
        
        <!-- Progress Bar -->
        <div class="w-4/5 max-w-lg mb-10">
            <div class="flex justify-between text-sm mb-1">
                <span x-text="`${Math.round(progressPercentage)}% Complete`"></span>
                <span x-text="`${timeSpentMinutes}/${currentTask?.timer || 0} min`"></span>
            </div>
            <div class="progress-bar">
                <div class="progress-bar-fill" :style="`width: ${progressPercentage}%`"></div>
            </div>
        </div>
        
        <!-- Timer Controls -->
        <div class="timer-controls">
            <button @click="toggleTimer" :disabled="!currentTask" class="btn-primary px-6 py-3" x-text="isRunning ? 'Pause' : 'Resume'"></button>
            <button @click="stopTimer" :disabled="!currentTask" class="btn-secondary px-6 py-3">Stop</button>
            <button @click="completeTask" :disabled="!currentTask" class="btn-primary px-6 py-3">Complete</button>
        </div>
    </div>

    <script>
        function timerApp() {
            return {
                currentTask: null,
                taskId: null,
                remainingSeconds: 0,
                isRunning: false,
                timerInterval: null,
                
                get progressPercentage() {
                    if (!this.currentTask || this.currentTask.timer <= 0) return 0;
                    const totalTimeSeconds = this.currentTask.timer * 60;
                    const elapsedSeconds = totalTimeSeconds - this.remainingSeconds;
                    return (elapsedSeconds / totalTimeSeconds) * 100;
                },
                
                get timeSpentMinutes() {
                    if (!this.currentTask) return 0;
                    const totalTimeSeconds = this.currentTask.timer * 60;
                    const elapsedSeconds = totalTimeSeconds - this.remainingSeconds;
                    return Math.round(elapsedSeconds / 60);
                },

                formatTime(secondsOrMinutes) {
                    // Check if input is in seconds (larger values) or minutes (smaller values)
                    let totalMinutes;
                    if (secondsOrMinutes >= 3600) { // Likely seconds (more than 60 minutes in seconds)
                        totalMinutes = Math.floor(secondsOrMinutes / 60);
                    } else {
                        // Input is already in minutes
                        totalMinutes = secondsOrMinutes;
                    }

                    if (totalMinutes < 60) {
                        return `${totalMinutes} min`;
                    } else {
                        const hours = Math.floor(totalMinutes / 60);
                        const minutes = totalMinutes % 60;
                        if (minutes > 0) {
                            return `${hours}h ${minutes}m`;
                        } else {
                            return `${hours}h`;
                        }
                    }
                },

                async init() {
                    // Get task ID from URL
                    const urlParams = new URLSearchParams(window.location.search);
                    this.taskId = parseInt(urlParams.get('taskId'));

                    console.log('Initializing timer for taskId:', this.taskId);

                    if (this.taskId) {
                        await this.loadTask();
                        this.remainingSeconds = (this.currentTask.timer - this.currentTask.time_spent) * 60;
                        this.initialRemainingSeconds = this.remainingSeconds; // Сохраняем начальное значение

                        console.log('Loaded task:', this.currentTask);
                        console.log('Calculated remainingSeconds:', this.remainingSeconds);

                        // Start the timer if it was previously running
                        if (this.currentTask.is_active) {
                            this.startTimer();
                        }
                    }
                },
                
                async loadTask() {
                    try {
                        console.log('Loading task with ID:', this.taskId);
                        const response = await fetch(`http://localhost:8000/tasks/${this.taskId}`);
                        this.currentTask = await response.json();
                        console.log('Task loaded successfully:', this.currentTask);
                    } catch (error) {
                        console.error('Error loading task:', error);
                    }
                },
                
                formatTime(seconds) {
                    const mins = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                },
                
                startTimer() {
                    if (this.timerInterval) clearInterval(this.timerInterval);

                    this.isRunning = true;
                    this.startTime = Date.now(); // Запоминаем время начала
                    console.log('Starting timer, initial remainingSeconds:', this.remainingSeconds);

                    // Используем более частый интервал для обновления UI
                    this.timerInterval = setInterval(() => {
                        // Обновляем remainingSeconds на основе прошедшего времени
                        const elapsedTime = Math.floor((Date.now() - this.startTime) / 1000);
                        const newRemaining = Math.max(0, this.initialRemainingSeconds - elapsedTime);

                        // Обновляем только если значение изменилось
                        if (this.remainingSeconds !== newRemaining) {
                            this.remainingSeconds = newRemaining;

                            // Log every 10 seconds to see timer progression
                            if (this.remainingSeconds % 10 === 0) {
                                console.log('Timer tick, remainingSeconds:', this.remainingSeconds);
                            }
                        }

                        if (this.remainingSeconds <= 0) {
                            this.endTimer();
                        }
                    }, 1000); // Обновляем каждую секунду для UI
                },

                pauseTimer() {
                    this.isRunning = false;
                    console.log('Pausing timer, remainingSeconds:', this.remainingSeconds);
                    if (this.timerInterval) {
                        clearInterval(this.timerInterval);
                        this.timerInterval = null;

                        // Обновляем remainingSeconds на основе прошедшего времени
                        if (this.startTime) {
                            const elapsedTime = Math.floor((Date.now() - this.startTime) / 1000);
                            this.remainingSeconds = Math.max(0, this.initialRemainingSeconds - elapsedTime);
                        }
                    }
                },
                
                toggleTimer() {
                    if (this.isRunning) {
                        this.pauseTimer();
                        this.sendPauseRequest();
                    } else {
                        this.startTimer();
                        this.sendResumeRequest();
                    }
                },
                
                endTimer() {
                    this.pauseTimer();
                    alert('Timer completed!');
                    // Optionally navigate back to tasks
                    window.location.href = '/';
                },
                
                async sendPauseRequest() {
                    try {
                        await fetch(`http://localhost:8000/tasks/${this.taskId}/pause-timer`, {
                            method: 'POST'
                        });
                    } catch (error) {
                        console.error('Error pausing timer:', error);
                    }
                },

                async sendResumeRequest() {
                    try {
                        await fetch(`http://localhost:8000/tasks/${this.taskId}/start-timer`, {
                            method: 'POST'
                        });
                    } catch (error) {
                        console.error('Error resuming timer:', error);
                    }
                },

                async stopTimer() {
                    this.pauseTimer();

                    // Calculate actual time elapsed based on start time
                    let timeElapsed;
                    if (this.startTime) {
                        // Calculate based on actual elapsed time since start
                        const actualElapsedTime = Math.floor((Date.now() - this.startTime) / 1000 / 60); // in minutes
                        timeElapsed = Math.max(0, actualElapsedTime);
                    } else {
                        // Fallback to previous calculation
                        timeElapsed = Math.floor((this.currentTask.timer * 60 - this.remainingSeconds) / 60);
                    }

                    // Log for debugging
                    console.log('Stop Timer Debug:');
                    console.log('  currentTask.timer:', this.currentTask.timer);
                    console.log('  remainingSeconds:', this.remainingSeconds);
                    console.log('  startTime:', this.startTime);
                    console.log('  calculated timeElapsed:', timeElapsed);

                    try {
                        const response = await fetch(`http://localhost:8000/tasks/${this.taskId}/stop-timer`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ time_elapsed: timeElapsed })
                        });

                        if (response.ok) {
                            window.location.href = '/';
                        }
                    } catch (error) {
                        console.error('Error stopping timer:', error);
                    }
                },

                async completeTask() {
                    if (!confirm('Are you sure you want to complete this task?')) return;

                    this.pauseTimer();

                    // Calculate time elapsed in minutes
                    const timeElapsed = Math.floor((this.currentTask.timer * 60 - this.remainingSeconds) / 60);

                    // Log for debugging
                    console.log('Complete Task Debug:');
                    console.log('  currentTask.timer:', this.currentTask.timer);
                    console.log('  remainingSeconds:', this.remainingSeconds);
                    console.log('  calculated timeElapsed:', timeElapsed);

                    try {
                        const response = await fetch(`http://localhost:8000/tasks/${this.taskId}/complete`,  {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ time_elapsed: timeElapsed })
                        });

                        if (response.ok) {
                            window.location.href = '/';
                        }
                    } catch (error) {
                        console.error('Error completing task:', error);
                    }
                }
            }
        }
    </script>
</body>
</html>
