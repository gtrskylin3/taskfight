<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFight - Boost Your Productivity</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div x-data="app()" class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-slate-800 shadow-lg">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-indigo-400">TaskFight</h1>
                <nav>
                    <ul class="flex space-x-4">
                        <li><a href="#" @click.prevent="currentView = 'tasks'" :class="{ 'bg-slate-700 text-white': currentView === 'tasks' }" class="nav-link">Tasks</a></li>
                        <li><a href="#" @click.prevent="currentView = 'dashboard'" :class="{ 'bg-slate-700 text-white': currentView === 'dashboard' }" class="nav-link">Dashboard</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow container mx-auto px-4 py-8">
            <!-- Tasks View -->
            <div x-show="currentView === 'tasks'" class="space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold">Your Tasks</h2>
                    <button @click="openTaskModal = true" class="btn-primary">Add Task</button>
                </div>

                <!-- Task Creation Modal -->
                <div x-show="openTaskModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" style="display: none;">
                    <div class="bg-slate-800 rounded-lg p-6 w-full max-w-md">
                        <h3 class="text-xl font-bold mb-4">Create New Task</h3>
                        <form @submit.prevent="createTask">
                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1">Task Name</label>
                                <input type="text" x-model="newTask.name" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white" required>
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1">Priority</label>
                                <select x-model="newTask.priority" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white">
                                    <option value="low">Low</option>
                                    <option value="medium">Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1">Tag</label>
                                <input type="text" x-model="newTask.tag" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white" required>
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1">Timer (minutes)</label>
                                <input type="number" x-model.number="newTask.timer" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white" required>
                            </div>
                            <div class="flex justify-end space-x-2">
                                <button type="button" @click="openTaskModal = false" class="btn-secondary">Cancel</button>
                                <button type="submit" class="btn-primary">Create</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Filters -->
                <div class="flex space-x-4 mb-6">
                    <button @click="activeFilter = 'all'" :class="{ 'bg-indigo-600': activeFilter === 'all' }" class="btn-secondary px-4 py-2">All Tasks</button>
                    <button @click="activeFilter = 'in-progress'" :class="{ 'bg-indigo-600': activeFilter === 'in-progress' }" class="btn-secondary px-4 py-2">In Progress</button>
                    <select x-model="selectedTag" class="bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white">
                        <option value="">All Tags</option>
                        <template x-for="tag in uniqueTags" :key="tag">
                            <option :value="tag" x-text="tag"></option>
                        </template>
                    </select>
                </div>

                <!-- Task List -->
                <div>
                    <template x-for="task in filteredTasks" :key="task.id">
                        <div class="task-card">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-lg" x-text="task.name"></h3>
                                    <div class="flex items-center space-x-4 mt-2">
                                        <span class="px-2 py-1 rounded text-xs" 
                                              :class="{
                                                  'bg-green-500': task.priority === 'low',
                                                  'bg-yellow-500': task.priority === 'medium', 
                                                  'bg-red-500': task.priority === 'high'
                                              }" 
                                              x-text="task.priority"></span>
                                        <span class="bg-indigo-500 px-2 py-1 rounded text-xs" x-text="task.tag"></span>
                                    </div>
                                </div>
                                <div class="flex space-x-2">
                                    <button @click="startTimer(task)" class="btn-primary text-sm">Start</button>
                                    <button @click="deleteTask(task.id)" class="btn-danger text-sm">Delete</button>
                                </div>
                            </div>
                            
                            <!-- Progress Bar -->
                            <div x-show="task.time_spent > 0" class="mt-3">
                                <div class="flex justify-between text-xs mb-1">
                                    <span x-text="`${Math.round((task.time_spent / task.timer) * 100)}% Complete`"></span>
                                    <span x-text="`${task.time_spent}/${task.timer} min`"></span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-bar-fill" :style="`width: ${Math.min(100, (task.time_spent / task.timer) * 100)}%`"></div>
                                </div>
                            </div>
                        </div>
                    </template>
                    
                    <div x-show="filteredTasks.length === 0" class="text-center py-8 text-slate-400">
                        <p>No tasks found. Create your first task!</p>
                    </div>
                </div>
            </div>

            <!-- Dashboard View -->
            <div x-show="currentView === 'dashboard'" class="space-y-6">
                <h2 class="text-2xl font-bold">Statistics Dashboard</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Time by Tag Chart -->
                    <div class="bg-slate-800 rounded-lg p-6">
                        <h3 class="text-lg font-semibold mb-4">Time Spent by Tag</h3>
                        <div class="space-y-2">
                            <template x-for="[tag, time] in Object.entries(timeByTag)" :key="tag">
                                <div class="flex items-center">
                                    <div class="w-32 text-sm" x-text="tag"></div>
                                    <div class="flex-grow ml-2">
                                        <div class="progress-bar">
                                            <div class="progress-bar-fill" :style="`width: ${Math.min(100, (time / maxTimeByTag) * 100)}%`"></div>
                                        </div>
                                    </div>
                                    <div class="w-16 text-right text-sm" x-text="`${time} min`"></div>
                                </div>
                            </template>
                        </div>
                    </div>
                    
                    <!-- Completed Tasks Chart -->
                    <div class="bg-slate-800 rounded-lg p-6">
                        <h3 class="text-lg font-semibold mb-4">Completed Tasks by Tag</h3>
                        <div class="space-y-2">
                            <template x-for="[tag, priorities] in Object.entries(completedTasksByTag)" :key="tag">
                                <div>
                                    <div class="font-medium" x-text="tag"></div>
                                    <div class="ml-2 space-y-1">
                                        <template x-for="[priority, count] in Object.entries(principles)" :key="priority">
                                            <div class="flex justify-between text-sm">
                                                <span x-text="priority"></span>
                                                <span x-text="count"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function app() {
            return {
                currentView: 'tasks',
                tasks: [],
                openTaskModal: false,
                newTask: {
                    name: '',
                    priority: 'medium',
                    tag: '',
                    timer: 25
                },
                activeFilter: 'all',
                selectedTag: '',
                
                // Stats
                timeByTag: {},
                completedTasksByTag: {},
                
                get uniqueTags() {
                    return [...new Set(this.tasks.map(t => t.tag))];
                },
                
                get filteredTasks() {
                    let filtered = this.tasks;
                    
                    // Apply filter based on activeFilter
                    if (this.activeFilter === 'in-progress') {
                        filtered = filtered.filter(task => task.time_spent > 0 && !task.is_completed);
                    }
                    
                    // Apply tag filter
                    if (this.selectedTag) {
                        filtered = filtered.filter(task => task.tag === this.selectedTag);
                    }
                    
                    // Sort by priority (high to low)
                    filtered.sort((a, b) => {
                        const priorityOrder = { high: 3, medium: 2, low: 1 };
                        return priorityOrder[b.priority] - priorityOrder[a.priority];
                    });
                    
                    return filtered;
                },
                
                get maxTimeByTag() {
                    return Math.max(...Object.values(this.timeByTag), 1);
                },
                
                async init() {
                    await this.loadTasks();
                    await this.loadStats();
                },
                
                async loadTasks() {
                    try {
                        const response = await fetch('http://localhost:8000/tasks/active');
                        this.tasks = await response.json();
                    } catch (error) {
                        console.error('Error loading tasks:', error);
                    }
                },
                
                async loadStats() {
                    try {
                        // Load time by tag
                        const timeResponse = await fetch('http://localhost:8000/statistics/time-by-tag');
                        this.timeByTag = await timeResponse.json();
                        
                        // Load completed tasks by tag and priority
                        const completedResponse = await fetch('http://localhost:8000/statistics/completed-tasks-by-tag-priority');
                        this.completedTasksByTag = await completedResponse.json();
                    } catch (error) {
                        console.error('Error loading stats:', error);
                    }
                },
                
                async createTask() {
                    try {
                        const response = await fetch('http://localhost:8000/tasks', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.newTask)
                        });
                        
                        if (response.ok) {
                            const task = await response.json();
                            this.tasks.push(task);
                            this.newTask = { name: '', priority: 'medium', tag: '', timer: 25 };
                            this.openTaskModal = false;
                        }
                    } catch (error) {
                        console.error('Error creating task:', error);
                    }
                },
                
                async deleteTask(taskId) {
                    if (!confirm('Are you sure you want to delete this task?')) return;
                    
                    try {
                        const response = await fetch(`http://localhost:8000/tasks/${taskId}`, {
                            method: 'DELETE'
                        });
                        
                        if (response.ok) {
                            this.tasks = this.tasks.filter(task => task.id !== taskId);
                        }
                    } catch (error) {
                        console.error('Error deleting task:', error);
                    }
                },
                
                async startTimer(task) {
                    try {
                        const response = await fetch(`http://localhost:8000/tasks/${task.id}/start-timer`, {
                            method: 'POST'
                        });
                        
                        if (response.ok) {
                            const updatedTask = await response.json();
                            const index = this.tasks.findIndex(t => t.id === task.id);
                            if (index !== -1) {
                                this.tasks[index] = updatedTask;
                            }
                            
                            // Navigate to timer page
                            window.location.href = `/timer.html?taskId=${task.id}`;
                        }
                    } catch (error) {
                        console.error('Error starting timer:', error);
                    }
                }
            }
        }
    </script>
</body>
</html>
